<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>實習通 · 串接進度</title>
<link rel="icon" href="/assets/cz/favicon.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" />
<link rel="stylesheet" href="/assets/cz/app.css" />
<style>
  .ck { width: min(980px, 94vw); margin: 0 auto; padding: 0 0 72px; }

  /* ---- 狀態總覽卡 ---- */
  .ckPanel { background: #fff; border: 1px solid #e7eaf0; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  .ckPanelHead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .ckPanelHead h2 { margin: 0; font-size: 18px; color: #11243f; }
  .ckBig { font-size: 30px; font-weight: 700; color: #11243f; line-height: 1.1; }
  .ckBig small { font-size: 14px; font-weight: 500; color: #8a94a3; }
  .ckBar { height: 10px; border-radius: 99px; background: #eef1f6; overflow: hidden; display: flex; margin: 12px 0 14px; }
  .ckBar i { display: block; height: 100%; }
  .ckBar i.done { background: #1a9e5c; }
  .ckBar i.doing { background: var(--theme-color); }
  .ckBar i.blocked { background: #d8392b; }
  .ckLegend { display: flex; gap: 8px; flex-wrap: wrap; }
  .ckCount { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 99px; border: 1px solid #e7eaf0; background: #fff; color: #5c6675; cursor: pointer; }
  .ckCount .dot { width: 8px; height: 8px; border-radius: 99px; background: #c7ced8; }
  .ckCount[data-f="doing"] .dot { background: var(--theme-color); }
  .ckCount[data-f="done"] .dot { background: #1a9e5c; }
  .ckCount[data-f="blocked"] .dot { background: #d8392b; }
  .ckCount.on { border-color: var(--theme-color); background: var(--theme-white); color: var(--theme-color-black); }

  /* ---- 身份 / 通行碼 ---- */
  .ckWho { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; border-top: 1px solid #eef1f6; margin-top: 16px; padding-top: 14px; }
  .ckField { display: flex; flex-direction: column; gap: 5px; }
  .ckField label { font-size: 12px; font-weight: 600; color: #6a7686; }
  .ckField input { border: 1px solid #d9e0ea; border-radius: 9px; padding: 8px 11px; font: inherit; font-size: 14px; min-width: 150px; background: #fff; color: #1a1a1a; }
  .ckField input:focus { outline: none; border-color: var(--theme-color); box-shadow: 0 0 0 3px rgba(1,130,253,.12); }
  .ckHint { font-size: 12.5px; color: #8a94a3; line-height: 1.6; }

  /* ---- 卡住區塊 ---- */
  .ckAlert { background: #fff5f4; border: 1px solid #f6cdc7; border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; }
  .ckAlert h2 { margin: 0 0 4px; font-size: 17px; color: #a52a1c; display: flex; align-items: center; gap: 8px; }
  .ckAlert p.sub { margin: 0 0 12px; font-size: 13px; color: #8b5a52; }
  .ckAlertRow { background: #fff; border: 1px solid #f2ddd9; border-radius: 11px; padding: 12px 14px; margin-top: 8px; }
  .ckAlertRow .t { font-size: 14.5px; font-weight: 600; color: #11243f; }
  .ckAlertRow .q { font-size: 13.5px; color: #4a5568; line-height: 1.65; margin-top: 5px; white-space: pre-wrap; }
  .ckAlertRow .m { font-size: 12px; color: #98a1ad; margin-top: 6px; }

  /* ---- 分期分頁（對齊 /handoff 的短 / 中 / 長期）---- */
  .ckStageBar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 14px; }
  .ckStageTab { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left;
    font: inherit; background: #fff; border: 1px solid #e7eaf0; border-radius: 13px; padding: 11px 14px; cursor: pointer; transition: .12s; }
  .ckStageTab:hover { border-color: #b9c4d1; }
  .ckStageTab b { font-size: 14.5px; color: #11243f; }
  .ckStageTab span { font-size: 11.5px; color: #8a94a3; }
  .ckStageTab em { font-style: normal; font-size: 13px; font-weight: 700; color: var(--theme-color-black); margin-top: 3px; }
  .ckStageTab.on { border-color: var(--theme-color); background: var(--theme-white); box-shadow: 0 0 0 3px rgba(1,130,253,.10); }

  .ckStagePill { font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .ckStagePill.s-short { background: #fdecec; color: #c0392b; }
  .ckStagePill.s-mid { background: #e8f2fe; color: #1861a8; }
  .ckStagePill.s-long { background: #eef2f7; color: #7a8494; }

  /* ---- 分組 ---- */
  .ckGroup { background: #fff; border: 1px solid #e7eaf0; border-radius: 16px; margin-bottom: 14px; overflow: hidden; }
  .ckGroupHead { padding: 15px 18px; border-bottom: 1px solid #eef1f6; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .ckGroupHead h3 { margin: 0; font-size: 16px; color: #11243f; }
  .ckGroupHead .sum { font-size: 12.5px; color: #8a94a3; flex: 1 1 220px; }
  .ckGroupHead .frac { font-size: 13px; font-weight: 700; color: var(--theme-color-black); background: var(--theme-white); padding: 3px 10px; border-radius: 99px; white-space: nowrap; }

  .ckItem { border-bottom: 1px solid #f2f4f8; }
  .ckItem:last-child { border-bottom: none; }
  .ckItem.hide { display: none; }
  .ckRow { display: flex; gap: 12px; align-items: flex-start; padding: 13px 18px; cursor: pointer; }
  .ckRow:hover { background: #fafcff; }
  .ckMark { width: 22px; height: 22px; border-radius: 7px; border: 2px solid #d5dbe4; flex: 0 0 auto; margin-top: 1px; display: grid; place-items: center; color: #fff; font-size: 13px; }
  .ckItem[data-s="done"] .ckMark { background: #1a9e5c; border-color: #1a9e5c; }
  .ckItem[data-s="doing"] .ckMark { background: var(--theme-color); border-color: var(--theme-color); }
  .ckItem[data-s="blocked"] .ckMark { background: #d8392b; border-color: #d8392b; }
  .ckMain { flex: 1; min-width: 0; }
  .ckTitle { font-size: 14.5px; color: #11243f; font-weight: 600; line-height: 1.5; }
  .ckItem[data-s="done"] .ckTitle { color: #7b8492; text-decoration: line-through; text-decoration-color: #cfd6de; }
  .ckMeta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 5px; }
  .ckRef { font-size: 11.5px; color: #7c8797; background: #f2f5f9; padding: 2px 8px; border-radius: 6px; }
  .ckWhen { font-size: 11.5px; color: #98a1ad; }
  .ckBadge { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
  .ckBadge.blocker { background: #ffe9e6; color: #b03123; }
  .ckBadge.note { background: var(--theme-white); color: var(--theme-color-black); }
  .ckBadge.staging { background: #fff4d6; color: #8a6a10; }
  .ckCaret { color: #b6bec9; font-size: 17px; margin-top: 2px; transition: transform .15s; }
  .ckItem.open .ckCaret { transform: rotate(180deg); }

  .ckBody { display: none; padding: 2px 18px 18px 52px; }
  .ckItem.open .ckBody { display: block; }
  .ckDetail { font-size: 13.5px; color: #4a5568; line-height: 1.75; margin: 0 0 10px; }
  .ckAccept { font-size: 13px; color: #1a5c3a; background: #eefaf3; border: 1px solid #cdeada; border-radius: 9px; padding: 9px 12px; line-height: 1.65; margin-bottom: 12px; }
  .ckAccept b { color: #14603c; }
  .ckStates { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .ckState { font: inherit; font-size: 13px; font-weight: 600; padding: 6px 13px; border-radius: 99px; border: 1px solid #dfe5ec; background: #fff; color: #5c6675; cursor: pointer; transition: .12s; }
  .ckState:hover { border-color: #b9c4d1; }
  .ckState.on[data-v="todo"] { background: #eef1f6; border-color: #cfd6de; color: #5c6675; }
  .ckState.on[data-v="doing"] { background: var(--theme-color); border-color: var(--theme-color); color: #fff; }
  .ckState.on[data-v="done"] { background: #1a9e5c; border-color: #1a9e5c; color: #fff; }
  .ckState.on[data-v="blocked"] { background: #d8392b; border-color: #d8392b; color: #fff; }

  .ckNotes { border-top: 1px dashed #e5e9f0; padding-top: 12px; }
  .ckNote { background: #f7f9fc; border-radius: 10px; padding: 10px 13px; margin-bottom: 8px; }
  .ckNote.blocker { background: #fff5f4; border: 1px solid #f6cdc7; }
  .ckNote.resolved { opacity: .55; }
  .ckNote .nh { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: #8a94a3; margin-bottom: 4px; }
  .ckNote .nh b { color: #4a5568; font-size: 12.5px; }
  .ckNote .nb { font-size: 13.5px; color: #2b2b2b; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ckNote .na { margin-left: auto; font-size: 12px; color: var(--theme-color); background: none; border: none; cursor: pointer; padding: 0; }
  .ckAdd { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; flex-wrap: wrap; }
  .ckAdd textarea { flex: 1 1 260px; min-height: 62px; border: 1px solid #d9e0ea; border-radius: 10px; padding: 9px 12px; font: inherit; font-size: 13.5px; line-height: 1.6; resize: vertical; color: #1a1a1a; background: #fff; }
  .ckAdd textarea:focus { outline: none; border-color: var(--theme-color); box-shadow: 0 0 0 3px rgba(1,130,253,.12); }
  .ckAddBtns { display: flex; flex-direction: column; gap: 6px; }

  .ckToolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .ckStale { font-size: 12.5px; color: #8a94a3; margin-left: auto; }
  .ckWarn { background: #fff4d6; border: 1px solid #f0dfae; color: #7a5c08; border-radius: 12px; padding: 11px 15px; font-size: 13px; line-height: 1.65; margin-bottom: 14px; }

  @media (max-width: 640px) {
    .ckStageBar { grid-template-columns: repeat(2, 1fr); }
    .ckBody { padding-left: 18px; }
    .ckRow { padding: 12px 14px; }
    .ckAddBtns { flex-direction: row; width: 100%; }
    .ckAddBtns .btn { flex: 1; }
  }
</style>
</head>
<body data-page="checklist">

<main>
  <section class="cz-hero" style="padding:34px 0 22px">
    <div class="cz-container">
      <span class="cz-eyebrow"><i class="ri-checkbox-multiple-line"></i> 串接進度</span>
      <h1 style="font-size:calc(var(--font-size)/3.4);margin:10px 0 8px">串接進度看板</h1>
      <p style="margin:0 0 10px;color:#5c6675;max-width:760px">
        交接文件裡的每一項工作都列在下面。串好了就點成「已完成」；卡住了點「卡住」並寫下問題，
        我這邊打開同一頁就看得到。<b>進度存在伺服器</b>，換裝置、換瀏覽器都不會不見。
      </p>
      <p style="margin:0;color:#7a8494;font-size:13.5px;max-width:760px">
        分期（短／中／長期、週次）沿用 <a href="/handoff#roadmap" style="color:var(--link-color)">開發排程</a> 與
        <a href="/handoff?doc=timeline#doc" style="color:var(--link-color)">工程時程規劃</a>：
        那邊是<b>計畫</b>（該做什麼、排在第幾週），這裡是<b>現況</b>（實際做到哪、卡在哪）。同一份項目，兩種看法。
      </p>
    </div>
  </section>

  <div class="ck" id="ck">
    <p class="ckHint" id="bootMsg">載入進度中⋯</p>
  </div>
</main>

<script src="/assets/cz/data.js"></script>
<script src="/assets/cz/app.js"></script>
<script src="/assets/checklist.js"></script>
</body>
</html>
