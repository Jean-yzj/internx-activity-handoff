<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>課程管理後台（Admin）｜職涯學院 · InternX 實習通</title>
<link rel="icon" href="/assets/cz/favicon.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" />
<link rel="stylesheet" href="/assets/cz/app.css" />
<link rel="stylesheet" href="/assets/academy/academy.css" />
<style>
  .layout { align-items: flex-start; }
  .profileName { font-size: 20px; font-weight: 700; color: #11243f; }
  .oaPill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
  .oaPill.dark { background: #11243f; color: #fff; }
  .statRow { background: #f7faff; border: 1px solid #e6eef8; border-radius: 12px; }
  .statBox { background: none; border: none; border-radius: 0; padding: 11px 6px; }
  .statBox + .statBox { border-left: 1px solid #e6eef8; }
  .statBox b { font-size: 17px; }
  .rvDetail { background: #f7faff; border: 1px solid #e6eef8; border-radius: 12px; padding: 14px 16px; margin: 10px 0 4px; font-size: 13px; color: #33475e; line-height: 1.8; }
  .rvDetail b { color: #11243f; }
  .logRow { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid #f0f2f6; font-size: 13px; color: #4a5a70; }
  .logRow:last-child { border-bottom: none; }
  .logRow .lt { color: #9aa7b8; white-space: nowrap; font-size: 12px; }
</style>
</head>
<body data-page="academy-admin" data-nav="academy">

<main>
  <h1 class="sr-only">課程管理後台（Admin）｜職涯學院</h1>
  <div class="cz-container profile">
    <div class="layout">

      <aside class="sidebar">
        <div class="sidebarCard">
          <div style="display:flex;justify-content:center"><div class="avatar" style="width:84px;height:84px;background:#11243f;font-size:30px">通</div></div>
          <h2 class="profileName">實習通 InternX</h2>
          <div class="sidebarBadgeStrip"><span class="oaPill dark"><i class="ri-shield-star-line"></i> 平台管理員</span></div>
          <p class="profileHeadline">職涯學院 · 課程管理後台</p>
          <p class="profileSchool" id="sideMeta"></p>
          <div class="sidebarButtons">
            <a class="btn btn-white btn-block" href="/academy"><i class="ri-graduation-cap-line"></i> 職涯學院前台</a>
            <a class="btn btn-white btn-block" href="/backstage"><i class="ri-dashboard-3-line"></i> 活動後台</a>
          </div>
          <div class="sidebarDivider"></div>
          <div class="statRow" id="sideStats"></div>
        </div>
      </aside>

      <div class="main">
        <div class="sectionTabs" id="tabs"></div>
        <div class="mainCard" id="body" style="border-top:none;border-radius:0 0 var(--border-radius) var(--border-radius)"></div>
      </div>

    </div>
  </div>
</main>

<script src="/assets/cz/data.js"></script>
<script src="/assets/cz/app.js"></script>
<script src="/assets/academy/academy.js"></script>
<script>
(function(){
  const I = window.IXA;
  let tab = "review";
  let orderFilter = "all";
  let openRv = "";

  const pendingCourses = () => I.db().courses.filter(c => c.status === "pending");
  const pendingApps = () => I.db().creatorApps.filter(a => a.status === "pending");

  function sidebar(){
    const sum = I.platformSummary();
    document.getElementById("sideMeta").innerHTML = '<i class="ri-book-2-line"></i> ' + I.published().length + ' 堂上架課程 · ' + I.db().orders.length + ' 筆近期訂單';
    document.getElementById("sideStats").innerHTML =
      '<div class="statBox warn"><b style="color:#c35500">' + pendingCourses().length + '</b><span>待審課程</span></div>' +
      '<div class="statBox warn"><b style="color:#c35500">' + pendingApps().length + '</b><span>待審講師</span></div>' +
      '<div class="statBox"><b>' + Math.round(sum.pending / 1000) + 'K</b><span>待撥款</span></div>';
  }
  function renderTabs(){
    const pc = pendingCourses().length + pendingApps().length;
    const tabs = [
      ["review", "ri-shield-check-line", "課程審核" + (pendingCourses().length ? ' <span class="navPend" style="background:#d80f0f;color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:0 6px;margin-left:4px">' + pendingCourses().length + '</span>' : "")],
      ["creators", "ri-user-star-line", "創作者" + (pendingApps().length ? ' <span class="navPend" style="background:#d80f0f;color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:0 6px;margin-left:4px">' + pendingApps().length + '</span>' : "")],
      ["orders", "ri-shopping-cart-2-line", "訂單"],
      ["revenue", "ri-funds-line", "收益"],
      ["settings", "ri-settings-3-line", "分潤設定"],
    ];
    document.getElementById("tabs").innerHTML = tabs.map(t =>
      '<button class="sectionTab ' + (tab === t[0] ? "active" : "") + '" data-t="' + t[0] + '"><i class="' + t[1] + '"></i> ' + t[2] + '</button>').join("");
    document.querySelectorAll("#tabs .sectionTab").forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
    I.a11yTabs(document.getElementById("tabs"), "active");
  }

  /* ================= 課程審核 ================= */
  function courseRow(c, actions){
    const u = I.USERS[c.creatorId] || {};
    const st = I.courseStats(c.id);
    const isOpen = openRv === c.id;
    return '<div class="ax-row" style="flex-wrap:wrap">' +
      '<div class="thumb" style="' + I.covStyle(c) + '"><i class="' + c.icon + '"></i></div>' +
      '<div class="rmain"><div class="rt">' + I.esc(c.title) + ' ' + (c.featured ? '<span class="atg featured"><i class="ri-star-fill"></i> 精選</span>' : '') + '</div>' +
      '<div class="rs">' + I.esc(u.name || "") + '（' + I.esc(c.creatorTitle) + '）· ' + (c.free ? "免費" : I.money(c.price)) + ' · ' + c.sections.length + ' 章 ' + I.lessonsOf(c).length + ' 單元' + (c.status === "published" ? ' · ' + st.students.toLocaleString("zh-TW") + ' 人購買' : (c.submittedAt ? ' · 送審於 ' + I.timeAgo(c.submittedAt) : '')) + '</div></div>' +
      '<div class="racts">' + actions + '</div>' +
      (isOpen ? '<div class="rvDetail" style="width:100%">' +
        '<b><i class="ri-focus-3-line"></i> 職涯導向欄位檢查（平台定位）</b><br>' +
        '職涯方向：' + (c.careers.length ? c.careers.map(k => I.careerOf(k).label).join("、") : "全方向") + '　·　技能：' + (c.skills || []).join("、") + '<br>' +
        '適合誰：' + (c.fitFor || []).join("；") + '<br>' +
        '學完獲得：' + (c.gains || []).join("；") + '<br>' +
        '對應職缺：' + (c.jobTypes || []).join("、") + '　·　履歷成果：' + (c.artifacts || []).map(a => a.t).join("、") + '<br>' +
        '<span style="color:' + ((c.gains || []).length && (c.fitFor || []).length ? '#1a8a35' : '#c35500') + '">' +
        ((c.gains || []).length && (c.fitFor || []).length ? '<i class="ri-checkbox-circle-line"></i> 職涯導向欄位齊全，符合平台定位' : '<i class="ri-error-warning-line"></i> 職涯導向欄位不完整 —— 退回時請註明') + '</span>' +
      '</div>' : '') + '</div>';
  }
  function paneReview(){
    const pend = pendingCourses();
    const pub = I.db().courses.filter(c => c.status === "published");
    const off = I.db().courses.filter(c => c.status === "off" || c.status === "rejected");
    return '<div class="sectionHeader"><div class="sectionHeaderLeft"><i class="ri-shield-check-line"></i> 待審核課程（' + pend.length + '）</div></div>' +
      (pend.length ? pend.map(c => courseRow(c,
        '<button class="btn btn-white btn-small" data-open="' + c.id + '"><i class="ri-file-search-line"></i> 審核內容</button>' +
        '<a class="btn btn-white btn-small" href="/course?id=' + c.id + '" target="_blank" rel="noopener"><i class="ri-eye-line"></i> 預覽</a>' +
        '<button class="btn btn-white btn-small" data-reject="' + c.id + '" style="color:#a33"><i class="ri-close-line"></i> 退回</button>' +
        '<button class="btn btn-small" data-approve="' + c.id + '"><i class="ri-check-line"></i> 通過上架</button>'
      )).join("") : '<p class="ax-muted" style="font-size:13px">沒有待審核的課程。</p>') +
      '<div class="sectionHeader" style="margin-top:20px"><div class="sectionHeaderLeft"><i class="ri-book-2-line"></i> 已上架（' + pub.length + '）</div></div>' +
      pub.map(c => courseRow(c,
        '<button class="btn btn-white btn-small" data-feat="' + c.id + '"><i class="' + (c.featured ? 'ri-star-fill' : 'ri-star-line') + '" style="color:#e2a200"></i> ' + (c.featured ? '取消精選' : '標記精選') + '</button>' +
        '<button class="btn btn-white btn-small" data-down="' + c.id + '" style="color:#a33"><i class="ri-arrow-down-circle-line"></i> 下架</button>'
      )).join("") +
      (off.length ? '<div class="sectionHeader" style="margin-top:20px"><div class="sectionHeaderLeft"><i class="ri-inbox-archive-line"></i> 已下架／退回（' + off.length + '）</div></div>' +
        off.map(c => courseRow(c,
          (c.status === "rejected" ? '<span class="atg rejected">退回：' + I.esc(c.rejectReason || "") + '</span>' : '<span class="atg off">已下架</span>') +
          '<button class="btn btn-white btn-small" data-approve="' + c.id + '"><i class="ri-arrow-up-circle-line"></i> 重新上架</button>'
        )).join("") : "") +
      '<div class="sectionHeader" style="margin-top:20px"><div class="sectionHeaderLeft"><i class="ri-history-line"></i> 審核日誌</div></div>' +
      I.db().adminLogs.slice(0, 8).map(l => '<div class="logRow"><span class="lt">' + I.timeAgo(l.at) + '</span><span>' + I.esc(l.text) + '</span></div>').join("");
  }

  /* ================= 創作者 ================= */
  function paneCreators(){
    const apps = pendingApps();
    const rows = Object.keys(I.db().creators).map(id => {
      const u = I.USERS[id] || { name: id };
      const cr = I.db().creators[id];
      const courses = I.db().courses.filter(c => c.creatorId === id);
      const gross = courses.reduce((s, c) => s + I.courseStats(c.id).gross, 0);
      const fee = I.db().settings.creatorFee[id];
      return { id, u, cr, n: courses.length, gross, fee };
    }).sort((a, b) => b.gross - a.gross);
    return '<div class="sectionHeader"><div class="sectionHeaderLeft"><i class="ri-user-add-line"></i> 講師申請（' + apps.length + '）</div>' +
      '<span style="font-size:12px;color:#8a94a3">共用 verified-role 審核；通過即可開課</span></div>' +
      (apps.length ? apps.map(a => '<div class="ax-row">' +
        '<div class="thumb" style="background:linear-gradient(135deg,#8a94a3,#5b6b7e)"><i class="ri-user-3-line"></i></div>' +
        '<div class="rmain"><div class="rt">' + I.esc(a.name) + ' <span class="atg pending">待審核</span></div>' +
        '<div class="rs">' + I.esc(a.school) + ' · ' + I.esc(a.title) + ' · 申請於 ' + I.timeAgo(a.appliedAt) + '</div>' +
        '<div class="rs" style="margin-top:4px;color:#4a5a70">開課構想：' + I.esc(a.intro) + '</div></div>' +
        '<div class="racts"><button class="btn btn-white btn-small" data-appno="' + a.id + '" style="color:#a33">拒絕</button>' +
        '<button class="btn btn-small" data-appok="' + a.id + '"><i class="ri-check-line"></i> 通過</button></div></div>').join("")
        : '<p class="ax-muted" style="font-size:13px">沒有待審核的申請。</p>') +
      '<div class="sectionHeader" style="margin-top:20px"><div class="sectionHeaderLeft"><i class="ri-team-line"></i> 創作者列表</div></div>' +
      '<div class="tableWrap"><table class="ax-table"><thead><tr><th>創作者</th><th>身份</th><th>課程</th><th>總銷售</th><th>分潤</th><th>狀態</th><th style="text-align:right">操作</th></tr></thead><tbody>' +
      rows.map(r => '<tr>' +
        '<td data-label="創作者"><b>' + I.esc(r.u.name) + '</b></td>' +
        '<td data-label="身份" class="wrap">' + I.esc(r.cr.title) + '</td>' +
        '<td data-label="課程">' + r.n + '</td>' +
        '<td data-label="總銷售">' + I.money(r.gross) + '</td>' +
        '<td data-label="分潤">' + (r.fee != null ? '<b style="color:#c35500">' + Math.round(r.fee * 100) + '%（個別）</b>' : Math.round(I.db().settings.defaultFee * 100) + '%') + '</td>' +
        '<td data-label="狀態">' + (r.cr.suspended ? '<span class="atg rejected">已停權</span>' : '<span class="atg live">正常</span>') + '</td>' +
        '<td data-label="操作" style="text-align:right"><div class="racts" style="justify-content:flex-end">' +
          '<button class="btn btn-white btn-small" data-fee="' + r.id + '">調整分潤</button>' +
          '<button class="btn btn-white btn-small" data-susp="' + r.id + '" style="color:' + (r.cr.suspended ? '#1a8a35' : '#a33') + '">' + (r.cr.suspended ? '恢復' : '停權') + '</button>' +
        '</div></td></tr>').join("") +
      '</tbody></table></div>';
  }

  /* ================= 訂單 ================= */
  function paneOrders(){
    let list = I.db().orders.slice().sort((a, b) => b.createdAt - a.createdAt);
    if (orderFilter !== "all") list = list.filter(o => o.status === orderFilter);
    const chips = [["all", "全部"], ["paid", "已付款"], ["pending", "待付款"], ["refunded", "已退款"]];
    return '<div class="sectionHeader"><div class="sectionHeaderLeft"><i class="ri-shopping-cart-2-line"></i> 訂單管理</div>' +
      '<button class="btn btn-white btn-small" id="expOrders"><i class="ri-file-excel-2-line"></i> 匯出 Excel</button></div>' +
      '<p style="font-size:12.5px;color:#8a94a3;margin:0 0 12px">示範資料保留近 30 天明細，較早訂單已彙總至各課程統計。Order／Payment／Enrollment／RevenueRecord 與主平台金流結構共用。</p>' +
      '<div class="ax-chips" style="margin-bottom:14px">' + chips.map(f => '<button type="button" class="ax-qf ' + (orderFilter === f[0] ? "on" : "") + '" data-of="' + f[0] + '" aria-pressed="' + (orderFilter === f[0]) + '">' + f[1] + '</button>').join("") + '</div>' +
      '<div class="tableWrap"><table class="ax-table"><thead><tr><th>訂單編號</th><th>學生</th><th>課程</th><th>金額</th><th>狀態</th><th>付款時間</th><th style="text-align:right">操作</th></tr></thead><tbody>' +
      list.map(o => {
        const c = I.getCourse(o.courseId);
        const stMap = { paid: '<span class="atg paid">已付款</span>', pending: '<span class="atg unpaid">待付款</span>', refunded: '<span class="atg refund">已退款</span>' };
        return '<tr><td data-label="編號" style="font-size:12px">' + o.id + '</td>' +
          '<td data-label="學生">' + I.esc(o.userName) + '</td>' +
          '<td data-label="課程" class="wrap">' + I.esc(c ? c.title : "") + '</td>' +
          '<td data-label="金額"><b>' + I.money(o.amount) + '</b></td>' +
          '<td data-label="狀態">' + (stMap[o.status] || o.status) + '</td>' +
          '<td data-label="付款時間">' + (o.paidAt ? I.dfull(o.paidAt) + " " + new Date(o.paidAt).toTimeString().slice(0, 5) : "—") + '</td>' +
          '<td data-label="操作" style="text-align:right">' + (o.status === "paid" && o.amount > 0 ? '<button class="btn btn-white btn-small" data-refund="' + o.id + '" style="color:#a33">退款</button>' : "") + '</td></tr>';
      }).join("") + '</tbody></table></div>';
  }

  /* ================= 收益 ================= */
  function paneRevenue(){
    const sum = I.platformSummary();
    const perCourse = I.db().courses.filter(c => c.status !== "draft").map(c => {
      const st = I.courseStats(c.id), fee = I.feeRateFor(c);
      return { c, st, fee, feeAmt: Math.round(st.gross * fee) };
    }).sort((a, b) => b.st.gross - a.st.gross);
    const perCreator = Object.keys(I.db().creators).map(id => Object.assign({ id, u: I.USERS[id] || { name: id } }, I.creatorRevenue(id))).sort((a, b) => b.total - a.total);
    return '<div class="sectionHeader"><div class="sectionHeaderLeft"><i class="ri-funds-line"></i> 平台收益總覽</div>' +
      '<button class="btn btn-white btn-small" id="expRev"><i class="ri-file-excel-2-line"></i> 匯出 Excel</button></div>' +
      '<div class="ax-statRow">' +
        '<div class="ax-statBox"><div class="l"><i class="ri-money-dollar-circle-line"></i> 總銷售額</div><div class="v ax-money">' + I.money(sum.gross) + '</div><div class="d">學生實付累計</div></div>' +
        '<div class="ax-statBox accent"><div class="l"><i class="ri-building-line"></i> 平台收入</div><div class="v ax-money">' + I.money(sum.fee) + '</div><div class="d">服務費收入</div></div>' +
        '<div class="ax-statBox warn"><div class="l"><i class="ri-hand-coin-line"></i> 創作者待撥款</div><div class="v ax-money">' + I.money(sum.pending) + '</div><div class="d">下次結算日撥付</div></div>' +
        '<div class="ax-statBox"><div class="l"><i class="ri-bank-line"></i> 已撥款</div><div class="v ax-money">' + I.money(sum.paidOut) + '</div><div class="d">歷史撥款累計</div></div>' +
      '</div>' +
      '<div class="sectionHeader" style="margin-top:6px"><div class="sectionHeaderLeft"><i class="ri-book-2-line"></i> 單一課程收入</div></div>' +
      '<div class="tableWrap"><table class="ax-table"><thead><tr><th>課程</th><th>創作者</th><th>人數</th><th>總銷售</th><th>抽成</th><th style="text-align:right">平台收入</th></tr></thead><tbody>' +
      perCourse.map(x => '<tr><td data-label="課程" class="wrap">' + I.esc(x.c.title) + '</td><td data-label="創作者">' + I.esc((I.USERS[x.c.creatorId] || {}).name || "") + '</td><td data-label="人數">' + x.st.students.toLocaleString("zh-TW") + '</td><td data-label="總銷售">' + I.money(x.st.gross) + '</td><td data-label="抽成">' + Math.round(x.fee * 100) + '%</td><td data-label="平台收入" style="text-align:right"><b>' + I.money(x.feeAmt) + '</b></td></tr>').join("") +
      '</tbody></table></div>' +
      '<div class="sectionHeader" style="margin-top:18px"><div class="sectionHeaderLeft"><i class="ri-team-line"></i> 單一創作者收入與撥款</div></div>' +
      '<div class="tableWrap"><table class="ax-table"><thead><tr><th>創作者</th><th>累計收益</th><th>已撥款</th><th>待撥款</th><th style="text-align:right">操作</th></tr></thead><tbody>' +
      perCreator.map(x => '<tr><td data-label="創作者"><b>' + I.esc(x.u.name) + '</b></td><td data-label="累計">' + I.money(x.total) + '</td><td data-label="已撥">' + I.money(x.paidOut) + '</td><td data-label="待撥"><b style="color:#c35500">' + I.money(x.pending) + '</b></td>' +
        '<td data-label="操作" style="text-align:right">' + (x.pending > 0 ? '<button class="btn btn-small" data-payout="' + x.id + '"><i class="ri-bank-card-line"></i> 標記撥款</button>' : '<span class="atg paid">已結清</span>') + '</td></tr>').join("") +
      '</tbody></table></div>' +
      '<p style="font-size:12px;color:#9aa7b8;margin-top:12px"><i class="ri-information-line"></i> V1 為人工撥款（標記）；自動撥款 API 於正式金流串接後開通。撥款動作會把該創作者所有 pending 分潤紀錄標為已撥款。</p>';
  }

  /* ================= 分潤設定 ================= */
  function paneSettings(){
    const s = I.db().settings;
    const creatorOpts = Object.keys(I.db().creators).map(id => '<option value="' + id + '">' + I.esc((I.USERS[id] || {}).name || id) + '</option>').join("");
    const courseOpts = I.db().courses.filter(c => c.status !== "draft").map(c => '<option value="' + c.id + '">' + I.esc(c.title) + '</option>').join("");
    return '<div class="sectionHeader"><div class="sectionHeaderLeft"><i class="ri-settings-3-line"></i> 分潤設定</div></div>' +
      '<div class="ax-form">' +
      '<label class="f">預設平台抽成（%）</label>' +
      '<div style="display:flex;gap:10px;max-width:340px"><input class="input" type="number" min="0" max="50" id="defFee" value="' + Math.round(s.defaultFee * 100) + '"><button class="btn btn-small" id="saveDefFee">儲存</button></div>' +
      '<div class="wizNote" style="font-size:12px;color:#8a94a3;margin-top:6px">適用所有未個別設定的課程；歷史訂單分潤不追溯（分潤率在付款當下寫入 RevenueRecord）。</div>' +
      '<label class="f" style="margin-top:22px">單一創作者抽成</label>' +
      '<div style="display:flex;gap:10px;max-width:520px;flex-wrap:wrap"><select class="input" id="crSel" style="flex:2;min-width:160px">' + creatorOpts + '</select><input class="input" type="number" min="0" max="50" id="crFee" placeholder="%" style="flex:1;min-width:80px"><button class="btn btn-small" id="saveCrFee">設定</button></div>' +
      (Object.keys(s.creatorFee).length ? '<div style="margin-top:8px">' + Object.keys(s.creatorFee).map(id => '<span class="ax-miniTag" style="margin-right:6px">' + I.esc((I.USERS[id] || {}).name || id) + '：' + Math.round(s.creatorFee[id] * 100) + '% <a href="#" data-crclear="' + id + '" style="color:#a33;text-decoration:none">✕</a></span>').join("") + '</div>' : "") +
      '<label class="f" style="margin-top:22px">單一課程抽成</label>' +
      '<div style="display:flex;gap:10px;max-width:520px;flex-wrap:wrap"><select class="input" id="coSel" style="flex:2;min-width:160px">' + courseOpts + '</select><input class="input" type="number" min="0" max="50" id="coFee" placeholder="%" style="flex:1;min-width:80px"><button class="btn btn-small" id="saveCoFee">設定</button></div>' +
      (Object.keys(s.courseFee).length ? '<div style="margin-top:8px">' + Object.keys(s.courseFee).map(id => '<span class="ax-miniTag" style="margin-right:6px">' + I.esc((I.getCourse(id) || {}).title || id) + '：' + Math.round(s.courseFee[id] * 100) + '% <a href="#" data-coclear="' + id + '" style="color:#a33;text-decoration:none">✕</a></span>').join("") + '</div>' : "") +
      '<label class="f" style="margin-top:22px">免費課程</label>' +
      '<label class="ck" style="display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:#33475e;cursor:pointer"><input type="checkbox" id="freeEx"' + (s.freeExempt ? " checked" : "") + '> 免費課程不收服務費</label>' +
      '</div>' +
      '<div class="sidebarDivider" style="margin:24px 0"></div>' +
      '<div class="sectionHeader"><div class="sectionHeaderLeft"><i class="ri-refresh-line"></i> 示範資料</div></div>' +
      '<p style="font-size:13px;color:#8a94a3;margin:0 0 10px">整站 demo 資料存在你的瀏覽器（localStorage）。重置會清除你操作過的購買、進度、審核與設定，回到初始示範狀態。</p>' +
      '<button class="btn btn-white btn-small" id="resetDemo" style="color:#a33"><i class="ri-restart-line"></i> 重置示範資料</button>';
  }

  /* ================= render / wire ================= */
  function render(){
    sidebar(); renderTabs();
    const panes = { review: paneReview, creators: paneCreators, orders: paneOrders, revenue: paneRevenue, settings: paneSettings };
    document.getElementById("body").innerHTML = '<div class="tabPane active" style="display:block">' + panes[tab]() + '</div>';
    wire();
  }
  function wire(){
    document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { openRv = openRv === b.dataset.open ? "" : b.dataset.open; render(); });
    document.querySelectorAll("[data-approve]").forEach(b => b.onclick = () => {
      const c = I.approveCourse(b.dataset.approve);
      CZ.toast("已通過「" + c.title + "」，課程上架（會通知創作者）"); render();
    });
    document.querySelectorAll("[data-reject]").forEach(b => b.onclick = () => {
      const c = I.getCourse(b.dataset.reject);
      CZ.modal('<div class="modalHero"><div class="esIcon" style="background:#fde8e6;color:#d8392b"><i class="ri-close-circle-line"></i></div></div>' +
        '<h3>退回「' + I.esc(c.title) + '」</h3>' +
        '<div class="modalField"><b>退回原因（會顯示給創作者）</b><textarea class="textArea" id="rjReason" rows="3" placeholder="例：職涯導向欄位不完整，請補「學完可以獲得什麼」與對應職缺" style="margin-top:6px"></textarea></div>' +
        '<div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn btn-white btn-small" onclick="CZ.closeModal()">取消</button><button class="btn btn-small" style="background:#d8392b" id="rjGo">退回修改</button></div>');
      document.getElementById("rjGo").onclick = () => {
        I.rejectCourse(c.id, document.getElementById("rjReason").value.trim() || "內容不符平台定位，請調整後重新送審");
        CZ.closeModal(); CZ.toast("已退回，創作者會收到通知"); render();
      };
    });
    document.querySelectorAll("[data-down]").forEach(b => b.onclick = () => {
      const c = I.getCourse(b.dataset.down);
      CZ.modal('<h3>下架「' + I.esc(c.title) + '」？</h3><p style="font-size:13.5px;color:#5b6b7e;text-align:center;margin:0 0 16px">已購買的學生不受影響，課程將從探索頁隱藏。</p>' +
        '<div style="display:flex;gap:10px;justify-content:center"><button class="btn btn-white btn-small" onclick="CZ.closeModal()">取消</button><button class="btn btn-small" style="background:#d8392b" id="tdGo">確認下架</button></div>');
      document.getElementById("tdGo").onclick = () => { I.takedownCourse(c.id); CZ.closeModal(); CZ.toast("已下架"); render(); };
    });
    document.querySelectorAll("[data-feat]").forEach(b => b.onclick = () => {
      const c = I.getCourse(b.dataset.feat);
      I.setFeatured(c.id, !c.featured); CZ.toast(c.featured ? "已標記精選（探索頁優先曝光）" : "已取消精選"); render();
    });
    document.querySelectorAll("[data-appok]").forEach(b => b.onclick = () => { I.decideCreatorApp(b.dataset.appok, true); CZ.toast("已通過講師申請（發 verified-creator 標章）"); render(); });
    document.querySelectorAll("[data-appno]").forEach(b => b.onclick = () => { I.decideCreatorApp(b.dataset.appno, false); CZ.toast("已拒絕申請"); render(); });
    document.querySelectorAll("[data-susp]").forEach(b => b.onclick = () => {
      const cr = I.db().creators[b.dataset.susp];
      I.setSuspended(b.dataset.susp, !cr.suspended); render();
    });
    document.querySelectorAll("[data-fee]").forEach(b => b.onclick = () => { tab = "settings"; render(); document.getElementById("crSel").value = b.dataset.fee; });
    document.querySelectorAll("[data-of]").forEach(b => b.onclick = () => { orderFilter = b.dataset.of; render(); });
    document.querySelectorAll("[data-refund]").forEach(b => b.onclick = () => {
      const o = I.db().orders.find(x => x.id === b.dataset.refund);
      CZ.modal('<h3>退款訂單 ' + o.id + '？</h3><p style="font-size:13.5px;color:#5b6b7e;text-align:center;margin:0 0 16px">退款 ' + I.money(o.amount) + ' 給 ' + I.esc(o.userName) + '，同時收回上課權限、分潤紀錄標記為退款。</p>' +
        '<div style="display:flex;gap:10px;justify-content:center"><button class="btn btn-white btn-small" onclick="CZ.closeModal()">取消</button><button class="btn btn-small" style="background:#d8392b" id="rfGo">確認退款</button></div>');
      document.getElementById("rfGo").onclick = () => { I.refundOrder(o.id); CZ.closeModal(); CZ.toast("已退款（Payment → refunded，Enrollment 已收回）"); render(); };
    });
    document.querySelectorAll("[data-payout]").forEach(b => b.onclick = () => {
      const po = I.markPayout(b.dataset.payout);
      if (po) CZ.toast("已撥款 " + I.money(po.amount) + "（pending 分潤已標記完成）");
      render();
    });
    const eo = document.getElementById("expOrders");
    eo && (eo.onclick = () => {
      I.exportCSV([["訂單編號","學生","課程","金額","狀態","建立時間","付款時間"]].concat(
        I.db().orders.map(o => [o.id, o.userName, (I.getCourse(o.courseId) || {}).title || "", o.amount, o.status, I.dfull(o.createdAt), o.paidAt ? I.dfull(o.paidAt) : ""])), "academy-orders.csv");
      CZ.toast("已匯出 orders.csv");
    });
    const er = document.getElementById("expRev");
    er && (er.onclick = () => {
      I.exportCSV([["課程","創作者","人數","總銷售","抽成","平台收入"]].concat(
        I.db().courses.filter(c => c.status !== "draft").map(c => { const st = I.courseStats(c.id), fee = I.feeRateFor(c); return [c.title, (I.USERS[c.creatorId] || {}).name || "", st.students, st.gross, Math.round(fee * 100) + "%", Math.round(st.gross * fee)]; })), "academy-revenue.csv");
      CZ.toast("已匯出 revenue.csv");
    });
    if (tab === "settings") {
      document.getElementById("saveDefFee").onclick = () => {
        const v = Math.min(50, Math.max(0, +document.getElementById("defFee").value || 0));
        I.db().settings.defaultFee = v / 100; I.save(); CZ.toast("預設抽成已改為 " + v + "%（不追溯歷史訂單）"); render();
      };
      document.getElementById("saveCrFee").onclick = () => {
        const id = document.getElementById("crSel").value, v = document.getElementById("crFee").value;
        if (v === "") { CZ.toast("請輸入 %"); return; }
        I.db().settings.creatorFee[id] = Math.min(50, Math.max(0, +v)) / 100; I.save(); CZ.toast("已設定個別抽成"); render();
      };
      document.getElementById("saveCoFee").onclick = () => {
        const id = document.getElementById("coSel").value, v = document.getElementById("coFee").value;
        if (v === "") { CZ.toast("請輸入 %"); return; }
        I.db().settings.courseFee[id] = Math.min(50, Math.max(0, +v)) / 100; I.save(); CZ.toast("已設定課程抽成"); render();
      };
      document.querySelectorAll("[data-crclear]").forEach(a => a.onclick = e => { e.preventDefault(); delete I.db().settings.creatorFee[a.dataset.crclear]; I.save(); render(); });
      document.querySelectorAll("[data-coclear]").forEach(a => a.onclick = e => { e.preventDefault(); delete I.db().settings.courseFee[a.dataset.coclear]; I.save(); render(); });
      document.getElementById("freeEx").onchange = e => { I.db().settings.freeExempt = e.target.checked; I.save(); CZ.toast("已更新"); };
      document.getElementById("resetDemo").onclick = () => {
        CZ.modal('<h3>重置示範資料？</h3><p style="font-size:13.5px;color:#5b6b7e;text-align:center;margin:0 0 16px">會清除此瀏覽器上所有 Academy 操作紀錄，回到初始狀態。</p>' +
          '<div style="display:flex;gap:10px;justify-content:center"><button class="btn btn-white btn-small" onclick="CZ.closeModal()">取消</button><button class="btn btn-small" style="background:#d8392b" onclick="IXA.resetDemo()">確認重置</button></div>');
      };
    }
  }

  if (I.qs("tab")) tab = I.qs("tab");
  render();
})();
</script>
</body>
</html>
